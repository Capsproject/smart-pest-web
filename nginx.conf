server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /healthz {
        access_log off;
        return 200;
    }

    # Hashed build assets: cache forever, they change name on every release
    location ~* \.(?:js|css|woff2?|ttf|eot|png|jpg|jpeg|gif|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Never cache the shell so clients always pick up the latest hashed bundles
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Angular client-side routing fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
